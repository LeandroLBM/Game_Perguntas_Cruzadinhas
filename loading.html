<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <title>Loading</title>
    <link rel="stylesheet" href="./css/loading.css">
    <link rel="icon" href="./imgs/">
</head>

<body>
    <div class="quadrinho">
        <div class="part1">
            <div id="img1" class="img1"></div>
            <div id="img2" class="img2"></div>
            <div id="img3" class="img3"></div>
        </div>
        <div class="part2">
            <div id="img4" class="img4"></div>
            <div id="img5" class="img5"></div>
            <div id="img6" class="img6">
                <a id="proximo">
                    <button onclick="botao()">JOGAR</button>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
<script>
    let numero = 0;

    let intervalor = setInterval(() => {
        numero++;
        if (numero === 1) {
            img1.style.backgroundImage = `url('./imgs/Loading/img1.png')`;
        } else if (numero === 2) {
            img2.style.backgroundImage = `url('./imgs/Loading/img2.png')`;
        } else if (numero === 3) {
            img3.style.backgroundImage = `url('./imgs/Loading/img3.png')`;
        } else if (numero === 4) {
            img4.style.backgroundImage = `url('./imgs/Loading/img4.png')`;
        } else if (numero === 5) {
            img5.style.backgroundImage = `url('./imgs/Loading/img5.png')`;
        } else if (numero === 6) {
            clearInterval(intervalor);
            img6.style.backgroundImage = `url('./imgs/Loading/img6.png')`;
            proximo.style.display = "flex"
        }
    }, 1000);
</script>
